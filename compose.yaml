services:
  wyoming-omnivoice:
    image: ${OMNIVOICE_IMAGE:-ghcr.io/valentinealan/wyoming-omnivoice:1.1.0}
    user: "568:568"
    init: true
    restart: unless-stopped
    ports:
      - "${OMNIVOICE_BIND_IP:-0.0.0.0}:${OMNIVOICE_PORT:-10200}:10200"
    environment:
      OMNIVOICE_DEVICE: cpu
      OMNIVOICE_LANGUAGE: English
      OMNIVOICE_LANGUAGE_CODE: en
      OMNIVOICE_VOICE: example
      OMNIVOICE_LOG_LEVEL: WARNING
    volumes:
      - ${OMNIVOICE_DATA_DIR:-./data}:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
