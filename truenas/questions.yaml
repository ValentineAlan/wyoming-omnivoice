groups:
- description: Configure OmniVoice
  name: OmniVoice Configuration
- description: Configure the user and group for OmniVoice
  name: User and Group Configuration
- description: Configure Network for OmniVoice
  name: Network Configuration
- description: Configure Storage for OmniVoice
  name: Storage Configuration
- description: Configure Labels for OmniVoice
  name: Labels Configuration
- description: Configure Resources for OmniVoice
  name: Resources Configuration
questions:
- group: OmniVoice Configuration
  label: ''
  schema:
    attrs:
    - label: Inference Device
      schema:
        default: cpu
        enum:
        - description: CPU
          value: cpu
        - description: NVIDIA GPU (select a GPU below)
          value: cuda
        type: string
      variable: device
    - label: Synthesis Language
      schema:
        default: English
        type: string
      variable: language
    - label: Language Code (BCP 47)
      schema:
        default: en
        type: string
      variable: language_code
    - description: Higher values trade latency for quality. 8 steps has been tested
        on Tesla P40.
      label: Generation Steps
      schema:
        default: 32
        max: 100
        min: 1
        type: int
      variable: num_step
    - description: For example /data/voices/reference.wav. Supply both audio and an
        accurate transcript, or leave both empty.
      label: Reference Audio Path Inside /data (Optional)
      schema:
        default: ''
        type: string
      variable: voice_ref
    - label: Reference Audio Transcript (Optional)
      schema:
        default: ''
        private: true
        type: string
      variable: ref_text
    - label: Additional Environment Variables
      schema:
        default: []
        items:
        - label: Environment Variable
          schema:
            attrs:
            - label: Name
              schema:
                required: true
                type: string
              variable: name
            - label: Value
              schema:
                type: string
              variable: value
            type: dict
          variable: env
        type: list
      variable: additional_envs
    type: dict
  variable: omnivoice
- group: User and Group Configuration
  label: ''
  schema:
    attrs:
    - description: The user id that OmniVoice files will be owned by.
      label: User ID
      schema:
        default: 568
        min: 2
        required: true
        type: int
      variable: user
    - description: The group id that OmniVoice files will be owned by.
      label: Group ID
      schema:
        default: 568
        min: 2
        required: true
        type: int
      variable: group
    type: dict
  variable: run_as
- group: Network Configuration
  label: ''
  schema:
    attrs:
    - label: Wyoming TCP Port
      schema:
        attrs:
        - description: 'The port bind mode.</br>

            - Publish: The port will be published on the host for external access.</br>

            - Expose: The port will be exposed for inter-container communication.</br>

            - None: The port will not be exposed or published.</br>

            Note: If the Dockerfile defines an EXPOSE directive,

            the port will still be exposed for inter-container communication regardless
            of this setting.

            '
          label: Port Bind Mode
          schema:
            default: published
            enum:
            - description: Publish port on the host for external access
              value: published
            - description: Expose port for inter-container communication
              value: exposed
            - description: None
              value: ''
            type: string
          variable: bind_mode
        - label: Port Number
          schema:
            default: 10200
            max: 65535
            min: 1
            required: true
            type: int
          variable: port_number
        - description: IPs on the host to bind this port
          label: Host IPs
          schema:
            default: []
            items:
            - label: Host IP
              schema:
                $ref:
                - definitions/node_bind_ip
                required: true
                type: string
              variable: host_ip
            show_if:
            - - bind_mode
              - '='
              - published
            type: list
          variable: host_ips
        type: dict
      variable: wyoming_port
    type: dict
  variable: network
- group: Storage Configuration
  label: ''
  schema:
    attrs:
    - description: Persistent /data directory. Allow space for downloaded model weights.
        Must be writable by the configured user.
      label: Model Cache and Voice Storage
      schema:
        attrs:
        - description: 'ixVolume: Is dataset created automatically by the system.</br>

            Host Path: Is a path that already exists on the system.

            '
          label: Type
          schema:
            default: ix_volume
            enum:
            - description: Host Path (Path that already exists on the system)
              value: host_path
            - description: ixVolume (Dataset created automatically by the system)
              value: ix_volume
            required: true
            type: string
          variable: type
        - description: The configuration for the ixVolume dataset.
          label: ixVolume Configuration
          schema:
            $ref:
            - normalize/ix_volume
            attrs:
            - description: Enable ACL for the storage.
              label: Enable ACL
              schema:
                default: false
                type: boolean
              variable: acl_enable
            - description: The name of the dataset to use for storage.
              label: Dataset Name
              schema:
                default: data
                hidden: true
                required: true
                type: string
              variable: dataset_name
            - label: ACL Configuration
              schema:
                attrs: []
                show_if:
                - - acl_enable
                  - '='
                  - true
                type: dict
              variable: acl_entries
            show_if:
            - - type
              - '='
              - ix_volume
            type: dict
          variable: ix_volume_config
        - label: Host Path Configuration
          schema:
            attrs:
            - description: Enable ACL for the storage.
              label: Enable ACL
              schema:
                default: false
                type: boolean
              variable: acl_enable
            - label: ACL Configuration
              schema:
                $ref:
                - normalize/acl
                attrs: []
                show_if:
                - - acl_enable
                  - '='
                  - true
                type: dict
              variable: acl
            - description: The host path to use for storage.
              label: Host Path
              schema:
                required: true
                show_if:
                - - acl_enable
                  - '='
                  - false
                type: hostpath
              variable: path
            - label: Automatic Permissions
              schema:
                default: false
                type: boolean
              variable: auto_permissions
            show_if:
            - - type
              - '='
              - host_path
            type: dict
          variable: host_path_config
        type: dict
      variable: data
    type: dict
  variable: storage
- group: Labels Configuration
  label: ''
  schema:
    default: []
    items:
    - label: Label
      schema:
        attrs:
        - label: Key
          schema:
            required: true
            type: string
          variable: key
        - label: Value
          schema:
            required: true
            type: string
          variable: value
        - description: Containers where the label should be applied
          label: Containers
          schema:
            items:
            - label: Container
              schema:
                enum:
                - description: wyoming-omnivoice
                  value: wyoming-omnivoice
                required: true
                type: string
              variable: container
            type: list
          variable: containers
        type: dict
      variable: label
    type: list
  variable: labels
- group: Resources Configuration
  label: ''
  schema:
    attrs:
    - label: Limits
      schema:
        attrs:
        - description: CPUs limit for OmniVoice.
          label: CPUs
          schema:
            default: 4
            required: true
            type: int
          variable: cpus
        - description: Memory limit for OmniVoice.
          label: Memory (in MB)
          schema:
            default: 8192
            required: true
            type: int
          variable: memory
        type: dict
      variable: limits
    - group: Resources Configuration
      label: GPU Configuration
      schema:
        $ref:
        - definitions/gpu_configuration
        attrs: []
        type: dict
      variable: gpus
    type: dict
  variable: resources
