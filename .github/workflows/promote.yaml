name: Promote tested release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing tested stable GHCR version to mark latest
        required: true
        default: '1.1.0'
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-container
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote without rebuilding CUDA layers
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:latest"
